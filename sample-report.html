<title>Claudeアプデ 2026-10-04〜10-10(サンプル・最新ではありません)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 革の地に紙のパネルを並べた掲示板。濃い革の地に羊皮紙のパネル、真鍮の枠。
   上から「概要(件数)」「今週の注目(3件)」「カテゴリ別+カレンダー」「あなたの環境への影響」「更新一覧(全件)」。
   1つの世界に固定した単一テーマ(ライト/ダーク共通) */
:root{
  color-scheme:dark;
  --bg:#1e150f; --leather:#2c2018; --leather-2:#3a2b20;
  --paper:#ecdfbf; --paper-2:#e2d2ab; --ink:#2b1f14; --ink-soft:#5e4a35;
  --brass:#c9a24a; --brass-dim:#8a6d33; --fg:#f3e8cf; --muted:#c8b694;
  --seal:#a8322a; --new:#2f6f9a; --up:#3f7d3a; --change:#b8661d; --end:#a8322a; --fix:#6a4c93;
  --ok:#3f7d3a; --warn:#b8861d; --bad:#a8322a;
  --font-display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;margin:0;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 2px,transparent 2px 9px),radial-gradient(ellipse at top,rgba(201,162,74,.08),transparent 60%)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:var(--new)} a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 枠 */
.frame{background:var(--leather);border:2px solid var(--brass);border-radius:6px;box-shadow:inset 0 0 0 4px var(--leather),inset 0 0 0 5px var(--brass-dim),0 6px 18px rgba(0,0,0,.45);padding:18px;min-width:0;overflow-wrap:anywhere;position:relative}
.frame>h2{font-family:var(--font-display);font-weight:400;font-size:1.25rem;letter-spacing:.12em;margin:0 0 14px;color:var(--brass);display:flex;align-items:center;gap:10px}
.frame>h2::before,.frame>h2::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--brass-dim))}
.frame>h2::after{background:linear-gradient(90deg,var(--brass-dim),transparent)}
.paper{background:var(--paper);color:var(--ink);border-radius:3px;box-shadow:0 2px 0 var(--paper-2),0 3px 8px rgba(0,0,0,.35)}
.paper a{color:#1f5a85}
.stars{color:var(--brass);letter-spacing:1px;font-size:.95rem;white-space:nowrap}
.paper .stars{color:#a07418}

/* 1. 概要 */
.report{display:grid;gap:16px}
.report .eyebrow{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);letter-spacing:.05em}
.report h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,4.4vw,2.4rem);line-height:1.25;margin:0;color:var(--fg);text-wrap:balance}
.tally{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.medal{display:grid;justify-items:center;gap:4px;text-align:center;padding:10px 4px}
.medal .coin{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--paper);border:3px solid var(--brass);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.medal b{font-family:var(--font-mono);font-size:1.6rem;line-height:1;color:var(--fg)}
.medal span{font-size:.78rem;color:var(--muted)}
.medal .en{font-family:var(--font-display);font-size:.8rem;color:var(--brass);letter-spacing:.08em}
.sharp{display:grid;gap:6px}
.sharp .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.sharp .gauge{display:flex;height:16px;border:2px solid var(--brass);border-radius:2px;background:#120c08;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.sharp .gauge span{height:100%;border-right:2px solid #120c08}
.sharp .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 2. 今週の注目 */
.urgent{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qp{padding:16px 16px 14px;position:relative;display:grid;gap:6px;align-content:start}
.qp .seal{position:absolute;top:-10px;right:12px;background:var(--seal);color:#fbe9df;font-family:var(--font-display);font-size:.8rem;padding:2px 10px;border-radius:2px;letter-spacing:.1em;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.qp .head{display:flex;align-items:center;gap:10px}
.qp .emb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;color:var(--paper);border:2px solid var(--ink-soft)}
.qp h3{font-family:var(--font-display);font-weight:400;font-size:1.05rem;line-height:1.45;margin:0}
.qp p{margin:0;font-size:.9rem;color:var(--ink-soft)}
.qp .goal{font-size:.78rem;color:var(--ink-soft);border-top:1px dashed var(--ink-soft);padding-top:6px}

/* 3. カテゴリ別 + カレンダー */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(201,162,74,.25)}
.st:last-child{border-bottom:0}
.st .ico{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;font-size:19px;color:var(--paper);border:1.5px solid var(--brass-dim)}
.st .nm{font-weight:700}
.st .val{font-family:var(--font-mono);color:var(--brass);font-size:1.05rem}
.st .bar{grid-column:2/4;height:8px;background:#120c08;border:1px solid var(--brass-dim);border-radius:1px;overflow:hidden}
.st .bar span{display:block;height:100%}
.st .mix{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.76rem;color:var(--muted)}
.st .mix span{display:inline-flex;align-items:center;gap:3px}
.diary{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:3px}
.drow:nth-child(odd){background:rgba(255,255,255,.03)}
.drow .d{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.drow .d b{color:var(--fg);font-weight:500}
.drow .icons{display:flex;flex-wrap:wrap;gap:4px}
.pin{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;color:var(--paper);border:1.5px solid var(--brass-dim);cursor:pointer;padding:0}
.pin:hover{border-color:var(--brass)}
.drow .none{font-size:.78rem;color:var(--brass-dim)}
.note{font-size:.78rem;color:var(--muted);margin:10px 0 0}

/* 4. 環境への影響 */
.basis{font-size:.84rem;color:var(--muted);margin:0 0 12px}
.gear{display:grid;gap:12px}
.slot{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;padding:14px;position:relative}
.slot .wp{width:54px;height:54px;border-radius:4px;display:grid;place-items:center;font-size:26px;color:var(--paper)}
.slot .who{font-weight:700}
.slot .stamp{display:inline-block;font-family:var(--font-display);font-size:.85rem;border:2px solid currentColor;border-radius:3px;padding:0 8px;margin:4px 0 6px;transform:rotate(-2deg)}
.slot p{margin:0 0 4px;font-size:.92rem}
.slot .sub{font-size:.84rem;color:var(--ink-soft)}
.slot .rel{font-size:.78rem;color:var(--ink-soft);margin-top:4px;border-top:1px dashed var(--ink-soft);padding-top:4px}
.noimp{font-size:.84rem;color:var(--muted);margin:12px 0 0}

/* 5. 更新一覧 */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:.82rem;border:1.5px solid var(--brass-dim);background:var(--leather-2);color:var(--fg);border-radius:3px;padding:2px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{border-color:var(--brass);background:var(--brass);color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.q{padding:14px;display:grid;gap:6px;align-content:start;scroll-margin-top:16px;position:relative}
.q.flash{outline:3px solid var(--brass);outline-offset:3px}
.q .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.q .emb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--paper);flex:none}
.q .meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:.75rem}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:2px;padding:0 6px;line-height:1.7;color:#fbf3e1;font-size:.74rem}
.tag.line{background:none;border:1.5px solid currentColor}
.q h3{font-size:.98rem;margin:0;line-height:1.5}
.q p{margin:0;font-size:.88rem}
.q .aud{font-size:.8rem;color:var(--ink-soft)}
.q .hist{font-size:.8rem;border-left:3px solid var(--seal);padding-left:8px}
.src{font-size:.76rem;display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--ink-soft);border-top:1px dashed rgba(94,74,53,.5);padding-top:6px}
.src a{word-break:break-all}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

/* 表 */
.tablewrap{overflow-x:auto;border:1.5px solid var(--brass-dim);border-radius:3px;background:var(--leather-2)}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:560px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid rgba(201,162,74,.25);vertical-align:top}
th{color:var(--brass);font-weight:700;font-size:.78rem}
tr:last-child td{border-bottom:0}
td a{color:#9cc7e6}
details summary{cursor:pointer;font-family:var(--font-display);font-size:1.1rem;color:var(--brass);list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"◆";font-size:.75em;transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
details>.inner{margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .frame{padding:14px 12px}
  .tally{gap:4px}.medal .coin{width:40px;height:40px;font-size:19px}.medal b{font-size:1.25rem}.medal span{display:none}
}
</style>

function days(){

  for(let d=new Date(a);d<=b&&out.length<62;d.setDate(d.getDate()+1)){
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    out.push({iso,label:(d.getMonth()+1)+"/"+d.getDate(),wd:"日月火水木金土"[d.getDay()]});
  }
  return out;
}

  const claims=DATA.claims||[]; if(!claims.length&&DATA.mode!=="verify") return "";
  const missed=items.filter(i=>(DATA.missed_ids||[]).includes(i.id));
  return `<section class="frame"><h2>貼られたまとめの検証</h2><div class="tablewrap"><table><thead><tr><th>主張</th><th>判定</th><th>正しい内容</th><th>出典</th></tr></thead><tbody>${claims.map(c=>{const v=VERD[c.verdict]||VERD.unverified;return `<tr><td>${esc(c.claim)}</td><td style="color:${v[1]};white-space:nowrap">${v[0]}</td><td>${esc(c.correction)}</td><td style="font-size:.76rem">${(c.sources||[]).map(s=>`<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a></div>`).join("")}</td></tr>`}).join("")}</tbody></table></div></section>
  <section class="frame"><h2>元のまとめに無かった更新</h2>${missed.length?`<div class="board">${missed.map(qHtml).join("")}</div>`:`<div class="empty">見落としは見つかりませんでした。</div>`}</section>`;
}
function boardHtml(){
  const shown=items.filter(i=>(!fCat||i.category===fCat)&&(!fConf||i.confidence===fConf)&&(!fRank||String(rank(i))===fRank)).sort((a,b)=>rank(b)-rank(a)||String(b.date).localeCompare(String(a.date)));
  const chip=(g,v,label,cur)=>`<button class="chip" data-g="${g}" data-v="${esc(v??"")}" aria-pressed="${cur===v}">${label}</button>`;
  return `<section class="frame"><h2>更新一覧</h2>
    <div class="filters" role="group" aria-label="カテゴリで絞り込む">${chip("c",null,"すべて",fCat)}${CATS.map(c=>chip("c",c.k,ic(c.icon)+esc(c.k),fCat)).join("")}</div>
    <div class="filters" role="group" aria-label="優先度と信頼度で絞り込む">${chip("r",null,"★すべて",fRank)}${["3","2","1"].map(r=>chip("r",r,"★".repeat(+r)+"☆".repeat(3-r),fRank)).join("")}${Object.entries(CONF).map(([k,v])=>chip("f",k,v[2]+" "+v[0],fConf)).join("")}</div>
    <p class="note" style="margin:0 0 12px">★の数は読む優先度。★★★=今週の注目/★★=あなたの環境に関係する・仕様変更・終了/★=その他。</p>
    ${shown.length?`<div class="board">${shown.map(qHtml).join("")}</div>`:`<div class="empty">この条件に当てはまる更新はありません。</div>`}</section>`;
}
function tailHtml(){
  const changed=items.filter(i=>i.history);
  return `${changed.length?`<section class="frame"><h2>状態が変わったもの</h2><div class="tablewrap"><table><thead><tr><th>日付</th><th>項目</th><th>経緯</th></tr></thead><tbody>${changed.map(i=>`<tr><td class="mono">${esc(i.date)}</td><td>${esc(i.title)}</td><td>${esc(i.history)}</td></tr>`).join("")}</tbody></table></div></section>`:""}
  <section class="frame"><details><summary>探した場所と読めた範囲(${(DATA.searched||[]).length}か所)</summary><div class="inner">
    <div class="tablewrap"><table><thead><tr><th>情報源</th><th>状態</th><th>読めた範囲</th><th>件数</th></tr></thead><tbody>${(DATA.searched||[]).map(s=>`<tr><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.source)}</a>`:esc(s.source)}</td><td>${esc(s.status)}</td><td>${esc(s.range)}</td><td class="mono">${esc(s.count)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">✅ 公式ページを開いて本文を確認 / 🟡 独立した報道2本以上が一致 / ⚠️ ソース1本・食い違い・開けなかった・見出しのみ</p></div></details></section>`;
}
function render(){
  document.getElementById("app").innerHTML=reportHtml()+urgentHtml()+statusHtml()+impactHtml()+verifyHtml()+boardHtml()+tailHtml();
  document.querySelectorAll(".chip[data-g]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.v||null; if(b.dataset.g==="c")fCat=v; else if(b.dataset.g==="r")fRank=v; else fConf=v;
    try{localStorage.setItem("cud-filter3",JSON.stringify({c:fCat,f:fConf,r:fRank}))}catch(e){}
    render();
  }));
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    let el=document.getElementById("q-"+b.dataset.jump);
    if(!el){fCat=null;fConf=null;fRank=null;render();el=document.getElementById("q-"+b.dataset.jump)}
    if(el){el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}
  }));
}
document.title=DATA.title||document.title;
render();
</script>
